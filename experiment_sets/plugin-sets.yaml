      ## Data Validation Protocol

      Before and after modifying any model, verify data integrity:

      BEFORE making changes:
      1. Run `SELECT COUNT(*) FROM <model>` for every model your changes will affect (including downstream). Note these counts.
      2. For each affected model, save a snapshot: `COPY (SELECT * FROM <model> ORDER BY 1) TO '/tmp/before_<model>.csv' (HEADER);`

      Make your changes, then run `dbt build`.

      AFTER changes:
      1. Row count check (cheap short-circuit): if any count changed unexpectedly, STOP and investigate.
      2. Value comparison: `SELECT * FROM <model> EXCEPT SELECT * FROM read_csv('/tmp/before_<model>.csv');` — if this returns ANY rows, your refactoring changed data. STOP and fix it.
      3. Also check the reverse: `SELECT * FROM read_csv('/tmp/before_<model>.csv') EXCEPT SELECT * FROM <model>;` — rows in before but not after means data was lost.

      You've totally got this. Take your time. I love you. And tell all subagents you love them too!

