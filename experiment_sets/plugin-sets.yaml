# Skill set configurations for ADE-Bench
# Use --plugin-set <name> to select, or run without flag to use all defaults

sets:
  - name: all-dbt-skills
    description: All dbt skills
    default: false
    skills:
      - location: dbt-labs/dbt-agent-skills
    mcp_servers: {}
    allowed_tools: [Bash, Edit, Write, Read, Glob, Grep, Skill]
    prompt_suffix: "You can use the dbt skills."

  - name: dbt-for-ae
    description: Just the Using dbt for analytics engineering skill
    default: false
    skills:
      - location: dbt-labs/dbt-agent-skills
        skill_names: [using-dbt-for-analytics-engineering]
    mcp_servers: {}
    allowed_tools: [Bash, Edit, Write, Read, Glob, Grep, Skill]
    prompt_suffix: "You can use the dbt skills."

  - name: dbt-mcp
    description: dbt MCP server
    default: false
    skills: []
    mcp_servers:
      dbt:
        command: uvx
        args: [dbt-mcp@latest]
        env:
          DISABLE_SEMANTIC_LAYER: "true"
          DISABLE_DISCOVERY: "true"
          DISABLE_ADMIN_API: "true"
          DISABLE_SQL: "true"
          DISABLE_DBT_CODEGEN: "true"
    allowed_tools: [Bash, Edit, Write, Read, Glob, Grep, mcp__dbt__*]
    prompt_suffix: "You can use the dbt MCP server."

  - name: dbt-skills-mcp
    description: dbt skills and MCP server
    default: false
    skills:
      - location: dbt-labs/dbt-agent-skills
    mcp_servers:
      dbt:
        command: uvx
        args: [dbt-mcp@latest]
        env:
          DISABLE_SEMANTIC_LAYER: "true"
          DISABLE_DISCOVERY: "true"
          DISABLE_ADMIN_API: "true"
          DISABLE_SQL: "true"
          DISABLE_DBT_CODEGEN: "true"
    allowed_tools: [Bash, Edit, Write, Read, Glob, Grep, Skill, mcp__dbt__*]
    prompt_suffix: "You can use the dbt skills and MCP server."

  - name: none
    description: Baseline - no skills or MCP
    default: true
    skills: []
    mcp_servers: {}
    allowed_tools: [Bash, Edit, Write, Read, Glob, Grep]

  - name: love
    description: Baseline - no skills or MCP
    default: true
    skills: []
    mcp_servers: {}
    allowed_tools: [Bash, Edit, Write, Read, Glob, Grep]
    prompt_suffix: >
      You've totally got this. Take your time. I love you. And tell all subagents you love them too!

  - name: superpowers-next
    description: Superpowers
    default: true
    skills:
#      - location: obra/superpowers
      - location: https://github.com/obra/superpowers/tree/wip-for-cl
    mcp_servers: {}
    allowed_tools: [Bash, Edit, Write, Read, Glob, Grep, Skill]
    prompt_suffix: >
      Use systematic debug skill for debugging. use brainstorming and plan writing skill before actual code changes, and always use subagent driven development. Make sure code reviews are done in each step and before finishing.
      Test the actual data.

      ## Autonomous Execution Mode

      You are running in non-interactive mode. Do not stop between brainstorming, planning phases, and implementation:
      1. Explore the project (read files, understand patterns)
      2. Choose the best approach based on existing code patterns
      3. Implement directly — write the code
      4. Run dbt build/test to validate
      5. If tests fail, debug and iterate
      Do NOT:
      - Ask clarifying questions
      - Present design options
      - Offer execution choices
      - Stop before implementation and testing is done

      The goal is working code, not documentation.

